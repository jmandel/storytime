<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d1b2e">
<title>Storytime</title>
<style>
  :root { --bg:#1d1b2e; --panel:#28253d; --fg:#f5f2ea; --muted:#a9a4bd; --accent:#ffb347; --ok:#7bd88f; --warn:#ff7a7a; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font:clamp(17px, calc(10px + 1.4vmin), 26px)/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow:hidden; }
  button { font:inherit; border:0; border-radius:999px; padding:.8em 1.6em; cursor:pointer;
    background:var(--accent); color:#222; font-weight:600; touch-action:manipulation; }
  button.ghost { background:rgba(255,255,255,.14); color:var(--fg); }
  button:disabled { opacity:.35; }
  .screen { position:fixed; inset:0; display:none; }
  .screen.on { display:flex; }
  .center { flex-direction:column; align-items:center; justify-content:center; gap:1.2em;
    padding:24px; text-align:center; }
  h1 { font-size:2.2em; margin:0; }
  p { margin:0; color:var(--muted); max-width:28em; }
  #linkbox { word-break:break-all; font-size:.75em; color:var(--muted); max-width:30em; }

  /* Call: the video area, plus the book panel on the reader's side. */
  #call { background:#000; }
  #stage { position:relative; flex:1; min-width:0; min-height:0; background:#000; }
  #remote { width:100%; height:100%; object-fit:contain; background:#000; display:block; }
  #self { position:absolute; right:12px; bottom:12px; width:20vmin; max-width:220px; border-radius:12px;
    transform:scaleX(-1); object-fit:cover; aspect-ratio:3/4; background:#222; box-shadow:0 2px 12px #0008; }
  #status { position:absolute; left:12px; top:calc(12px + env(safe-area-inset-top)); padding:.3em .8em;
    border-radius:999px; background:#0009; font-size:.8em; }
  #status.ok { color:var(--ok); } #status.warn { color:var(--warn); }
  #waiting { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:1.4em; color:var(--muted); pointer-events:none; }
  #bar { position:absolute; left:12px; bottom:calc(12px + env(safe-area-inset-bottom)); display:flex; gap:10px; }
  #bar button { padding:.5em 1em; font-size:.85em; }
  #bar button.off { background:var(--warn); color:#222; }
  #pageBadge { position:absolute; left:12px; top:calc(2.6em + env(safe-area-inset-top)); padding:.3em .8em;
    border-radius:999px; background:#0009; font-size:.8em; color:var(--muted); display:none; }

  #book { display:none; flex:1; flex-direction:column; background:var(--panel); min-width:0; min-height:0; container-type:inline-size; }
  body.reader #book { display:flex; }
  body.reader #call { flex-direction:row; }
  body.reader #stage { flex:0 0 52%; }
  #bookHead { display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid #fff1; }
  #bookTitle { flex:1; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #bookHead button { padding:.4em 1em; font-size:.8em; }
  #reader { flex:1; display:flex; flex-direction:column; min-height:0; }
  #pageImg { display:block; max-width:calc(100% - 24px); max-height:30vh; margin:12px auto 0; border-radius:8px; object-fit:contain; }
  #textWrap { flex:1; position:relative; min-height:0; display:flex; }
  #textWrap::after { content:""; position:absolute; left:0; right:0; bottom:0; height:2.5em; pointer-events:none;
    background:linear-gradient(transparent, var(--panel)); opacity:0; transition:opacity .2s; }
  #moreCue { position:absolute; right:16px; bottom:4px; font-size:.8em; color:var(--accent); opacity:0; transition:opacity .2s;
    pointer-events:none; z-index:1; }
  #textWrap.more::after, #textWrap.more #moreCue { opacity:1; }
  .said { font-weight:500; }
  .who { font-size:.42em; font-weight:700; letter-spacing:.04em; text-transform:uppercase; vertical-align:super;
    margin-right:.3em; opacity:.85; }
  #pageNote { color:var(--accent); text-align:center; font-size:.9em; margin-top:8px; }
  #pageText { flex:1; overflow:auto; padding:12px 20px; line-height:1.35;
    white-space:pre-line; }
  #nav { display:flex; gap:12px; padding:10px 14px; align-items:center; }
  #nav button { flex:1; font-size:1.3em; padding:.5em; }
  #pageNum { color:var(--muted); min-width:4.5em; text-align:center; }
  #strip { display:flex; gap:8px; overflow-x:auto; padding:8px 14px 14px; scroll-snap-type:x proximity; }
  #strip img { height:clamp(44px, 9vmin, 96px); border-radius:6px; border:3px solid transparent; cursor:pointer; scroll-snap-align:center; }
  #strip img.cur { border-color:var(--accent); }
  #shelf { flex:1; overflow:auto; padding:0 16px 16px; display:none; max-width:none; }
  #shelf.on { display:block; }
  #shelf .mini-shelf { max-width:none; grid-template-columns:repeat(auto-fill, minmax(7.5em, 1fr)); }
  #shelf .mini-shelf img { height:9em; }
  #shelfMsg { padding:16px; color:var(--muted); }

  .mini-shelf { display:grid; grid-template-columns:repeat(auto-fill, minmax(6em, 1fr)); gap:.7em; width:100%; max-width:30em; }
  .library { width:100%; max-width:32em; text-align:left; }
  #start { justify-content:safe center; }
  #start .library input { box-shadow:0 0 0 6px var(--bg); }
  #start { overflow:auto; padding-top:max(24px, env(safe-area-inset-top)); padding-bottom:max(24px, env(safe-area-inset-bottom)); }
  .library h3 { font-size:.8em; color:var(--muted); font-weight:600; margin:.9em 0 .4em; text-transform:uppercase; letter-spacing:.04em; }
  .library h3:empty { display:none; }
  .library input { position:sticky; top:0; z-index:2; box-shadow:0 0 0 6px var(--panel); width:100%; font:inherit; padding:.5em .9em; border-radius:999px; border:0; margin-top:.6em;
    background:#3a3752; color:var(--fg); }
  .mini-shelf button { position:relative; background:none; padding:6px; border-radius:12px; color:var(--fg); font-weight:500; font-size:.75em;
    border:3px solid transparent; }
  .mini-shelf button.cur { border-color:var(--accent); }
  .pickNum { position:absolute; top:2px; right:2px; background:var(--accent); color:#222; border-radius:999px;
    min-width:1.6em; height:1.6em; line-height:1.6em; font-size:.85em; font-weight:700; }
  .mini-shelf img { width:100%; height:6.5em; object-fit:contain; display:block; margin-bottom:4px; }
  .row { display:flex; gap:.6em; flex-wrap:wrap; justify-content:center; }
  #lastCall { display:flex; flex-direction:column; align-items:center; gap:.5em; }
  button.small { font-size:.8em; padding:.5em 1.2em; }
  button.danger { color:var(--warn); }
  .overlay { position:fixed; inset:0; background:#000c; display:none; align-items:center; justify-content:center; z-index:10; padding:16px; }
  .overlay.on { display:flex; }
  .sheet { background:var(--panel); border-radius:16px; padding:1.2em; width:100%; max-width:28em; max-height:90vh; overflow:auto;
    display:flex; flex-direction:column; gap:.8em; }
  .sheet h2 { margin:0; font-size:1.2em; }
  .sheet label { display:flex; flex-direction:column; gap:.3em; font-size:.85em; color:var(--muted); }
  #readersRow { display:flex; flex-direction:column; align-items:center; gap:.5em; }
  .chip { background:rgba(255,255,255,.14); color:var(--fg); padding:.45em 1.1em; font-weight:600; border:2px solid transparent; }
  .chip.cur { background:var(--accent); color:#222; }
  .chip.add { background:none; border:2px dashed #fff4; color:var(--muted); }
  .sheet textarea, .sheet input { font:inherit; font-size:1.1em; padding:.5em .8em; border-radius:10px; border:0; background:#3a3752; color:var(--fg); }
  .sheet summary { color:var(--muted); font-size:.85em; cursor:pointer; }
  .sheet details label { margin-top:.6em; }
  #picker { position:fixed; inset:0; background:#000c; display:none; align-items:center; justify-content:center; z-index:10; padding:16px; }
  #picker.on { display:flex; }
  #pickerSheet { background:var(--panel); border-radius:16px; padding:1em; width:100%; max-width:32em; max-height:90vh; overflow:auto;
    display:flex; flex-direction:column; align-items:center; gap:14px; }
  #pickerSheet h2 { margin:0; font-size:1.2em; }
  #childNav { position:absolute; right:12px; top:calc(12px + env(safe-area-inset-top)); display:none; gap:8px; }
  #childNav button { padding:.35em .9em; font-size:.85em; }
  /* Tablet held upright: video on top, book below. */
  @media (orientation: portrait) {
    body.reader #call { flex-direction:column; }
    body.reader #stage { flex:0 0 36%; }
    #pageImg { max-height:18vh; }
  }
  #reader.noimg #pageImg { display:none; }
  /* Phones: give the words the room. */
  @media (orientation: portrait) and (max-width: 600px) {
    body.reader #stage { flex:0 0 34%; }
    #self { width:22vmin; }
    #pageImg { max-height:13vh; margin-top:8px; }
    #pageText { padding:8px 16px; }
    #nav { padding:6px 12px; }
    #nav button { font-size:1.05em; padding:.35em; }
    #strip { padding:4px 12px 10px; }
    #strip img { height:44px; }
    #bookHead { padding:6px 12px; }
  }
  @media (orientation: landscape) and (max-height: 500px) {
    body.reader #stage { flex:0 0 50%; }
    #self { width:18vmin; }
    #pageImg { display:none; }
    #pageText { padding:8px 16px; }
    #nav { padding:4px 12px; }
    #nav button { font-size:1em; padding:.3em; }
    #strip { padding:2px 12px 6px; }
    #strip img { height:40px; }
    #bookHead { padding:4px 12px; }
    #bar button { font-size:.75em; }
  }
</style>
</head>
<body>

<section id="start" class="screen center">
  <h1>Storytime</h1>
  <div id="readersRow" style="display:none">
    <p>Who's reading?</p>
    <div id="readers" class="row"></div>
  </div>
  <p id="startText"></p>
  <p id="startHint"></p>
  <div id="startShelf" class="library"></div>
  <button id="startBtn">Start a call</button>
  <div id="lastCall" style="display:none">
    <p id="lastCallText"></p>
    <div class="row">
      <button id="lastBackBtn" class="ghost">Back to the call</button>
      <button id="lastSendBtn" class="ghost">Send link again</button>
    </div>
  </div>
  <button id="settingsBtn" class="ghost small">Settings</button>
</section>

<div id="settings" class="overlay">
  <div class="sheet">
    <h2>Settings</h2>
    <label>Who reads (one name per line) <textarea id="set_readers" rows="3" placeholder="Gramma&#10;Grammie"></textarea></label>
    <label>Child's name <input id="set_child" placeholder="Cleo" autocomplete="off"></label>
    <details>
      <summary>Connection</summary>
      <label>Signaling relays <input id="set_relay" placeholder="wss://relay.example,wss://other.example" autocomplete="off"></label>
      <label>TURN servers (base64url JSON) <input id="set_turn" autocomplete="off"></label>
    </details>
    <div class="row">
      <button id="settingsSave">Save</button>
      <button id="settingsClose" class="ghost">Cancel</button>
    </div>
    <button id="settingsHome" class="ghost small">Share home link (set up another device)</button>
    <button id="settingsForget" class="ghost small danger">Forget this device</button>
  </div>
</div>

<section id="invite" class="screen center">
  <h1 id="inviteTitle"></h1>
  <button id="shareBtn">Share link</button>
  <button id="copyBtn" class="ghost">Copy link</button>
  <div id="linkbox"></div>
  <button id="goBtn" class="ghost">Open the call</button>
</section>

<section id="join" class="screen center">
  <h1 id="joinTitle">Storytime</h1>
  <p id="joinText">Tap to turn on the camera and join.</p>
  <button id="joinBtn">Join</button>
  <p id="joinErr" style="color:var(--warn)"></p>
</section>

<section id="call" class="screen">
  <div id="stage">
    <video id="remote" autoplay playsinline></video>
    <div id="waiting"></div>
    <video id="self" autoplay playsinline muted></video>
    <div id="status"></div>
    <div id="pageBadge"></div>
    <div id="bar">
      <button id="muteBtn" class="ghost">Mute</button>
      <button id="bookBtn" class="ghost" style="display:none">Book</button>
      <button id="leaveBtn" class="ghost">Leave</button>
    </div>
    <div id="childNav">
      <button id="childPrev" class="ghost" aria-label="Previous page">◀</button>
      <button id="childNext" class="ghost" aria-label="Next page">▶</button>
    </div>
  </div>
  <div id="book">
    <div id="bookHead">
      <div id="bookTitle">Books</div>
      <button id="shelfBtn" class="ghost">All books</button>
    </div>
    <div id="shelf" class="library"></div>
    <div id="shelfMsg"></div>
    <div id="reader" style="display:none">
      <img id="pageImg" alt="">
      <div id="pageNote"></div>
      <div id="textWrap"><div id="pageText"></div><div id="moreCue">more ↓</div></div>
      <div id="nav">
        <button id="prevBtn" class="ghost" aria-label="Previous page">◀</button>
        <div id="pageNum"></div>
        <button id="nextBtn" aria-label="Next page">▶</button>
      </div>
      <div id="strip"></div>
    </div>
  </div>
</section>

<div id="picker">
  <div id="pickerSheet">
    <h2>Pick a book</h2>
    <div id="pickerShelf" class="library"></div>
    <button id="pickerClose" class="ghost">Close</button>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
