<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storytime preview</title>
<style>
  html, body { margin:0; height:100%; background:#111; color:#ddd; font:15px/1.4 system-ui, sans-serif; }
  main { display:flex; gap:24px; align-items:flex-start; justify-content:center; padding:16px; flex-wrap:wrap; }
  figure { margin:0; }
  figcaption { margin-bottom:6px; color:#aaa; }
  iframe { border:10px solid #333; border-radius:18px; background:#000; display:block; }
  #tablet { width:1024px; height:720px; }
  #phone { width:390px; height:720px; }
  .box { overflow:hidden; }
  .box iframe { transform-origin:top left; }
</style>
</head>
<body>
<main>
  <figure><figcaption>Reader's tablet</figcaption><div class="box"><iframe id="tablet" allow="camera; microphone; autoplay; clipboard-write"></iframe></div></figure>
  <figure><figcaption>Child's phone on the stand</figcaption><div class="box"><iframe id="phone" allow="camera; microphone; autoplay; clipboard-write"></iframe></div></figure>
</main>
<script>
  // Both views join a fresh room; this page's own #lk=... (and any other settings) are passed through.
  const p = new URLSearchParams(location.hash.slice(1))
  const rand = n => btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(n)))).replace(/[+/=]/g, '')
  p.set('r', rand(12)); p.set('k', rand(18)); p.set('preview', '1')
  const src = role => { const q = new URLSearchParams(p); q.set('as', role); return `index.html#${q}` }
  const name = (k, d) => p.get(k) ? `${p.get(k)}'s` : d
  document.querySelectorAll('figcaption')[0].textContent = `${name('reader', "Reader's")} tablet`
  document.querySelectorAll('figcaption')[1].textContent = `${name('child', "Child's")} phone on the stand`
  document.getElementById('tablet').src = src('reader')
  document.getElementById('phone').src = src('child')
  // Scale the frames to fit: side by side on wide screens, stacked (each filling the width) on narrow ones.
  const fit = () => {
    const W = innerWidth - 32, frames = [...document.querySelectorAll('.box iframe')]
    const outer = f => f.offsetWidth  // includes the 10px border
    const sideBySide = W >= 900
    const common = Math.min(1, (W - 24) / frames.reduce((a, f) => a + outer(f), 0))
    frames.forEach(f => {
      const s = sideBySide ? common : Math.min(1, W / outer(f))
      f.style.transform = `scale(${s})`
      f.parentElement.style.width = `${outer(f) * s}px`
      f.parentElement.style.height = `${f.offsetHeight * s}px`
    })
  }
  addEventListener('resize', fit); fit()
</script>
</body>
</html>
